# KAS project file
header:
  version: 18
  includes:
    - common/elk-audio-os-v1.4.0.yml

machine: raspberrypi4-64
target: elkpi-audio-os-image

repos:
  meta-elkpi:
    url: https://github.com/elk-audio/meta-elkpi.git
    commit: 49436ac460d93e0fd397bd10a5b0fea31a552cda # wrynose
    path: layers/meta-elkpi
  meta-raspberrypi-elk:
    url: https://github.com/elk-audio/meta-raspberrypi-elk.git
    commit: 5ed3dc05917211c3d07596f5c464644727975a1d # wrynose
    path: layers/meta-raspberrypi-elk
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: f62c67921474370829d24a4fa01ef88543f3906b # wrynose 2026-07-06
    path: layers/meta-raspberrypi

local_conf_header:
  elkpi-conf: |
    SWU_VERSION = "1.4.0"
    RPI_KERNEL_DEVICETREE:remove = "broadcom/bcm2711-rpi-400.dtb broadcom/bcm2711-rpi-cm4.dtb"
    RPI_KERNEL_DEVICETREE_OVERLAYS:remove = "overlays/vc4-kms-dsi-7inch.dtbo"
    ENABLE_I2C = "1"
    KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev"
    ENABLE_UART = "1"
    SERIAL_CONSOLES = "57600;ttyS0"
    RPI_USE_U_BOOT = "1"
    EXTRA_IMAGE_FEATURES += "ssh-server-openssh package-management"
    DISTRO_FEATURES += "user-autostart-service"
    hostname:pn-base-files = "elk-pi"

    # Uncomment to enable Bluetooth audio streaming (PipeWire + WirePlumber + BlueZ5 SPA)
    DISTRO_FEATURES:append = " bluetooth-audio"

    # meta-elk ships elk-bluetooth-agent with SYSTEMD_AUTO_ENABLE = "disable"; enable it on RPi4
    SYSTEMD_AUTO_ENABLE:pn-elk-bluetooth-agent = "enable"

    # Write /etc/elk_image_info into every image (read by the healthcheck service)
    IMAGE_CLASSES += "elk-image-info"

    # Web GUI stack: Node.js + npm, Python web frameworks and nginx, to serve
    # web based UIs from the device (e.g. scraporchestra). Off by default in meta-elk.
    ELK_WEB_GUI = "1"

    # Comment the following for qt image
    BBMASK += "meta-elkpi/recipes-images/images/elkpi-audio-os-image-qt.bb"
    BBMASK += "meta-elk/recipes-qt/simple-qt/simple-qt_0.1.bb"
    BBMASK += "meta-elk/recipes-qt/qt/qtbase_git.bbappend"
    BBMASK += "meta-elk/recipes-binaries/sensei/sensei_git.bb"
