# KAS project file
# ELK Audio OS version: 1.4.0
# Yocto 6.0 wrynose LTS: the combined poky repository is no longer maintained,
# bitbake, openembedded-core and meta-yocto are separate repositories.
header:
  version: 18

repos:
  meta-elk:
    url: https://github.com/elk-audio/meta-elk.git
    commit: db5cfb9807ec5543a59a035db06e7281b2cb8cf8 # wrynose
    path: layers/meta-elk
  meta-elk-plugins:
    url: https://github.com/elk-community/meta-elk-plugins.git
    commit: a560b6f482f334530a740e4b9ea4250d006a0db9 # wrynose
    path: layers/meta-elk-plugins
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    commit: c0658455606b3a37d85d7cf03703d8b8d2ead667 # wrynose 2026-09-30
    path: layers/meta-swupdate
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 47d7dbdd10890bbd429bc0cccbe14435c37e5af1 # wrynose 2026-09-30
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:
      meta-webserver:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514 # yocto-6.0.3 (2.18)
    path: layers/bitbake
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: ef022bf82d79015802309d14c28b13373ebe53f5 # yocto-6.0.3
    path: layers/openembedded-core
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c # yocto-6.0.3
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

distro: elk
target: unset
machine: unset

bblayers_conf_header:
  custom-bblayers-conf: |
    POKY_BBLAYERS_CONF_VERSION = "2"

local_conf_header:
  elk-audio-os: |
    DL_DIR ?= "${TOPDIR}/../downloads"
    # usrmerge is now pulled in by INIT_MANAGER = "systemd" (see elk.conf)
    # Fixes: an error on libegl-mesa - for raspberrypi/recipes-graphics/userland
    DISTRO_FEATURES += "opengl"
    ELK_AUDIO_OS_VERSION = "1.4.0"
    PACKAGE_CLASSES ?= "package_ipk"
    # debug-tweaks was removed in walnascar
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password allow-root-login empty-root-password post-install-logging"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
    do_image_complete[deptask] += "do_populate_lic"
    PACKAGECONFIG:append:pn-qemu-native = " sdl"
    PACKAGECONFIG:append:pn-nativesdk-qemu = " sdl"
    CONF_VERSION = "2"
    SECURITY_STRINGFORMAT = "-Wformat -Wformat-security"
    INHERIT += "rm_work"
    # build and build-sdk share SSTATE_DIR: keep the hash equivalence DB with it
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
    LICENSE_FLAGS_ACCEPTED += "commercial synaptics-killswitch"

    # By default, mda-vst2 plugins are not installed in the image and SUSHI will not
    # have VST2 support enabled. If you have access to the VST2 SDK you can enable
    # both by setting the variable VST2SDK_PATH to the path of the vst2 sdk as
    # follows:
    # VST2SDK_PATH = "path/to/the/vst2sdk/in/your/build/machine/"
    # For example : VST2SDK_PATH = "/home/user/vstsdk2.4"
    # To disable VST2 support, just define `VST2SDK_PATH` as an empty string.
    VST2SDK_PATH = "/really_big_hdd/vstsdk2.4"
